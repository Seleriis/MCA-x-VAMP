plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "mca-vamp-compat-${minecraft_version}"
}

if (findProperty('compat_build_dir')) {
    layout.buildDirectory.set(file(findProperty('compat_build_dir')))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.exclude '**/gametest/**'
        resources.exclude 'data/mca_vamp_compat/structure/gametest/**'
    }
    gameTest {
        java.srcDir 'src/main/java'
        java.include '**/gametest/**'
        resources.srcDir 'src/main/resources'
        resources.include 'data/mca_vamp_compat/structure/gametest/**'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def localCompileLibs = file('local-mods')
def compatProfile = providers.gradleProperty('compatProfile').orElse('all').get()
def optionalRuntimeMods = []
if (compatProfile in ['werewolves', 'all']) {
    optionalRuntimeMods += "${localCompileLibs}/Werewolves-${werewolves_version}.jar"
}
if (compatProfile in ['easy', 'both', 'all']) {
    optionalRuntimeMods += "${localCompileLibs}/easy-villagers-neoforge-${easy_villagers_version}.jar"
}
if (compatProfile in ['both', 'all']) {
    optionalRuntimeMods += "${localCompileLibs}/mca-ev-compat-${mca_ev_compat_file_version}.jar"
}
if (compatProfile in ['bloodlines', 'all']) {
    optionalRuntimeMods += "${localCompileLibs}/bloodlines-${bloodlines_version}.jar"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            systemProperty 'mca.visualValidation', (findProperty('visualValidation') ?: 'false').toString()
            systemProperty 'mca.visualOutput', file(findProperty('visualOutput') ?: '../.implementation/visual/mca-vamp-compat').absolutePath
            programArguments.addAll('--width', '1280', '--height', '960')
            client()
            gameDirectory = project.file(findProperty('run_dir') ?: "run/client-${compatProfile}")
        }
        server {
            server()
            gameDirectory = project.file(findProperty('run_dir') ?: "run/server-${compatProfile}")
            programArgument '--nogui'
        }
        gameTestServer {
            systemProperty 'mca.shelterBenchmark', (findProperty('shelterBenchmark') ?: 'false').toString()
            systemProperty 'mca.shelterCandidate', (findProperty('shelterCandidate') ?: 'false').toString()
            systemProperty 'mca.shelterOutput', file(findProperty('shelterOutput') ?: '../.implementation/shelter/mca-vamp-compat.csv').absolutePath
            type = 'gameTestServer'
            gameDirectory = project.file(findProperty('run_dir') ?: "run/gametest-${compatProfile}")
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

dependencies {
    implementation files(
            "${localCompileLibs}/Vampirism-${vampirism_version}.jar",
            "${localCompileLibs}/mca-neoforge-${mca_version}.jar"
    )
    compileOnly files(
            "${localCompileLibs}/Werewolves-${werewolves_version}.jar",
            "${localCompileLibs}/easy-villagers-neoforge-${easy_villagers_version}.jar",
            "${localCompileLibs}/mca-ev-compat-${mca_ev_compat_file_version}.jar"
    )
    runtimeOnly files(optionalRuntimeMods)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.configureEach {
    if (name == 'runGameTestServer') {
        dependsOn 'gameTestClasses'
    }
}

tasks.named('sourcesJar') {
    from sourceSets.gameTest.allSource
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'mca.compat.requireMcaEvApi', (compatProfile in ['both', 'all']).toString()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-proc:none']
}

processResources {
    def replaceProperties = [
            version                    : project.version,
            minecraft_version          : minecraft_version,
            neoforge_version           : neoforge_version,
            vampirism_version          : vampirism_version,
            mca_version                : mca_version,
            werewolves_version         : werewolves_version,
            easy_villagers_version     : easy_villagers_version,
            mca_ev_compat_version      : mca_ev_compat_version,
            mca_ev_compat_version_range: mca_ev_compat_version_range,
            bloodlines_min_version     : bloodlines_min_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    exclude 'com/guilh/mca_vampirism_compat/gametest/**'
    exclude 'data/mca_vamp_compat/structure/gametest/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'guilh',
                'Specification-Version'   : '2',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'guilh',
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

tasks.register('runGameTests') {
    group = 'verification'
    description = "Runs NeoForge GameTests for compatProfile=${compatProfile}."
    dependsOn 'runGameTestServer'
}

def releaseDirectory = layout.buildDirectory.dir(
        "release/mca-vamp-compat-${minecraft_version}-${project.version}"
)

tasks.register('releaseBundle', Sync) {
    group = 'build'
    description = 'Builds the distributable jar, sources, release notes and SHA-256 manifest.'
    dependsOn tasks.named('build')
    into releaseDirectory
    from tasks.named('jar')
    from tasks.named('sourcesJar')
    from('LICENSE')
    from('README.md')
    from('CHANGELOG.md')
    from('RELEASE_NOTES.md')
    from('CURSEFORGE_DESCRIPTION.md')
    from('UPDATE_GUIDE.md')
    from('VALIDATION.md')

    doLast {
        File outputDirectory = releaseDirectory.get().asFile
        List<File> jars = outputDirectory
                .listFiles()
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        File checksumManifest = new File(outputDirectory, 'SHA256SUMS.txt')
        checksumManifest.setText(
                jars.collect { artifact ->
                    byte[] digest = java.security.MessageDigest
                            .getInstance('SHA-256')
                            .digest(artifact.bytes)
                    String checksum = digest.collect { String.format('%02x', it) }.join()
                    "${checksum}  ${artifact.name}"
                }.join(System.lineSeparator()) + System.lineSeparator(),
                'UTF-8'
        )
    }
}
