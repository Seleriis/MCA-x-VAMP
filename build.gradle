plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "mca-vamp-compat-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

def localCompileLibs = file('local-mods')
def compatProfile = providers.gradleProperty('compatProfile').orElse('all').get()
def optionalRuntimeMods = []
if (compatProfile in ['werewolves', 'all']) {
    optionalRuntimeMods += "${localCompileLibs}/Werewolves-${werewolves_version}.jar"
}
if (compatProfile in ['easy', 'all']) {
    optionalRuntimeMods += "${localCompileLibs}/easy-villagers-neoforge-${easy_villagers_version}.jar"
}
if (compatProfile == 'all') {
    optionalRuntimeMods += "${localCompileLibs}/mca-ev-compat-${mca_ev_compat_file_version}.jar"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file("run/client-${compatProfile}")
        }
        server {
            server()
            gameDirectory = project.file("run/server-${compatProfile}")
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file("run/gametest-${compatProfile}")
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation files(
            "${localCompileLibs}/Vampirism-${vampirism_version}.jar",
            "${localCompileLibs}/mca-neoforge-${mca_version}.jar"
    )
    compileOnly files(
            "${localCompileLibs}/Werewolves-${werewolves_version}.jar",
            "${localCompileLibs}/easy-villagers-neoforge-${easy_villagers_version}.jar",
            "${localCompileLibs}/mca-ev-compat-${mca_ev_compat_file_version}.jar"
    )
    runtimeOnly files(optionalRuntimeMods)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-proc:none']
}

processResources {
    def replaceProperties = [
            version                    : project.version,
            minecraft_version          : minecraft_version,
            neoforge_version           : neoforge_version,
            vampirism_version          : vampirism_version,
            mca_version                : mca_version,
            werewolves_version         : werewolves_version,
            easy_villagers_version     : easy_villagers_version,
            mca_ev_compat_version      : mca_ev_compat_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'guilh',
                'Specification-Version'   : '2',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'guilh',
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

def releaseDirectory = layout.buildDirectory.dir(
        "release/mca-vamp-compat-${minecraft_version}-${project.version}"
)

tasks.register('releaseBundle', Sync) {
    group = 'build'
    description = 'Builds the distributable jar, sources, release notes and SHA-256 manifest.'
    dependsOn tasks.named('build')
    into releaseDirectory
    from tasks.named('jar')
    from tasks.named('sourcesJar')
    from('LICENSE')
    from('README.md')
    from('CHANGELOG.md')
    from("RELEASE_NOTES_${project.version}.md")
    from('CURSEFORGE_DESCRIPTION.md')

    doLast {
        File outputDirectory = releaseDirectory.get().asFile
        List<File> jars = outputDirectory
                .listFiles()
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        File checksumManifest = new File(outputDirectory, 'SHA256SUMS.txt')
        checksumManifest.setText(
                jars.collect { artifact ->
                    byte[] digest = java.security.MessageDigest
                            .getInstance('SHA-256')
                            .digest(artifact.bytes)
                    String checksum = digest.collect { String.format('%02x', it) }.join()
                    "${checksum}  ${artifact.name}"
                }.join(System.lineSeparator()) + System.lineSeparator(),
                'UTF-8'
        )
    }
}
